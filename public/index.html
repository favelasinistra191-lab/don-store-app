<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DON STORE - Catálogo Oficial</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d0e15; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2.2rem; color: #a855f7; display: flex; align-items: center; justify-content: center; gap: 10px; }
    header p { color: #9ca3af; font-size: 0.95rem; margin-top: 5px; }
    
    .grid-produtos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
    .card-produto { background: #161824; border: 1px solid #2d2f45; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; transition: transform 0.2s, border-color 0.2s; }
    .card-produto:hover { transform: translateY(-5px); border-color: #a855f7; }
    .card-produto img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 15px; border-radius: 10px; padding: 8px; background: #0d0e15; border: 1px solid #26293b; }
    .card-produto h3 { font-size: 1.25rem; margin-bottom: 8px; color: #f3f4f6; }
    .card-produto p { font-size: 0.88rem; color: #9ca3af; margin-bottom: 15px; min-height: 40px; }
    .card-produto .preco { font-size: 1.6rem; font-weight: bold; color: #10b981; margin-bottom: 8px; }
    .card-produto .tag-status { font-size: 0.8rem; background: #1f2937; color: #25d366; border: 1px solid #25d366; padding: 4px 12px; border-radius: 20px; margin-bottom: 15px; font-weight: bold; }
    
    .btn-wpp { width: 100%; background: #25d366; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-wpp:hover { background: #1da851; }
  </style>
</head>
<body>

  <header>
    <h1>👻 DON STORE</h1>
    <p>Catálogo de Serviços - Atendimento e Finalização via WhatsApp</p>
  </header>

  <div class="grid-produtos" id="grid-produtos">
    <p style="text-align: center; width: 100%;">Carregando produtos...</p>
  </div>

  <script>
    async function carregarProdutos() {
      try {
        const res = await fetch('/api/produtos');
        const produtos = await res.json();
        
        const container = document.getElementById('grid-produtos');
        container.innerHTML = '';

        produtos.forEach(p => {
          const card = document.createElement('div');
          card.className = 'card-produto';
          
          card.innerHTML = `
            <img src="${p.imagem}" alt="${p.nome}">
            <h3>${p.nome}</h3>
            <p>${p.descricao}</p>
            <div class="preco">R$ ${p.preco.toFixed(2).replace('.', ',')}</div>
            <div class="tag-status">💬 Atendimento Direto</div>
            <button class="btn-wpp" onclick="finalizarNoWhatsapp('${p.nome}', ${p.preco}, '${p.whatsapp}')">
              Finalizar no WhatsApp
            </button>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        document.getElementById('grid-produtos').innerHTML = '<p style="color:red; text-align:center;">Erro ao carregar o catálogo de produtos.</p>';
      }
    }

    function finalizarNoWhatsapp(nome, preco, whatsapp) {
      const msg = encodeURIComponent(`Olá, DON STORE! Quero finalizar a compra do serviço: *${nome}* no valor de *R$ ${preco.toFixed(2).replace('.', ',')}*. Como faço para realizar o pagamento e envio?`);
      window.open(`https://wa.me/${whatsapp}?text=${msg}`, '_blank');
    }

    carregarProdutos();
  </script>
</body>
</html>
