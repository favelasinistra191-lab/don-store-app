<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DON STORE | Loja Oficial</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d0d12; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
    header h1 { color: #a855f7; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; }
    header p { color: #8b949e; font-size: 0.95rem; }
    .card { background: #161622; border: 1px solid #2d2d42; border-radius: 12px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .card h2 { color: #fff; font-size: 1.3rem; margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: #a1a1aa; margin-bottom: 5px; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #3f3f5a; background: #09090e; color: #fff; font-size: 1rem; outline: none; }
    input:focus, select:focus { border-color: #a855f7; }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #8b5cf6; color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #7c3aed; }
    #resultado { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; font-size: 0.9rem; text-align: center; }
    .sucesso { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .erro { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
  </style>
</head>
<body>

  <header>
    <h1>👻 DON STORE</h1>
    <p>Painel de Teste de Entrega Automática</p>
  </header>

  <div class="card">
    <h2>Simular Compra</h2>
    <form id="testeForm">
      <div class="form-group">
        <label for="email">Seu E-mail (para receber o acesso):</label>
        <input type="email" id="email" placeholder="seuemail@gmail.com" required>
      </div>

      <div class="form-group">
        <label for="produto">Selecione o Produto:</label>
        <select id="produto">
          <option value="netflix">Netflix Premium</option>
          <option value="disney">Disney+</option>
          <option value="smartfit">SmartFit</option>
        </select>
      </div>

      <button type="submit" id="btnEnviar">🚀 Executar Teste de Entrega</button>
    </form>

    <div id="resultado"></div>
  </div>

  <script>
    const form = document.getElementById('testeForm');
    const btn = document.getElementById('btnEnviar');
    const resultado = document.getElementById('resultado');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.innerText = "Processando no GitHub & Resend...";
      btn.disabled = true;
      resultado.style.display = 'none';

      const emailCliente = document.getElementById('email').value;
      const produto = document.getElementById('produto').value;

      try {
        const res = await fetch('/api/test-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emailCliente, produto })
        });

        const data = await res.json();

        if (res.ok) {
          resultado.className = 'sucesso';
          resultado.innerText = data.message;
        } else {
          resultado.className = 'erro';
          resultado.innerText = data.error || 'Ocorreu um erro no teste.';
        }
      } catch (err) {
        resultado.className = 'erro';
        resultado.innerText = 'Falha na conexão com o servidor.';
      } finally {
        resultado.style.display = 'block';
        btn.innerText = "🚀 Executar Teste de Entrega";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
