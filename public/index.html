<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DON STORE - Oficial</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d0e15; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
    
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2.2rem; color: #a855f7; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
    header p { color: #9ca3af; font-size: 0.95rem; margin-top: 5px; }

    /* Efeito de Animação/Movimentação */
    .screen { display: none; width: 100%; max-width: 900px; animation: fadeIn 0.4s ease-in-out forwards; }
    .screen.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Grid do Catálogo */
    .grid-produtos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; width: 100%; }
    .card-produto { background: #161824; border: 1px solid #2d2f45; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; transition: all 0.3s ease; cursor: pointer; }
    .card-produto:hover { transform: translateY(-8px) scale(1.02); border-color: #a855f7; box-shadow: 0 10px 20px rgba(168, 85, 247, 0.2); }
    .card-produto img { width: 85px; height: 85px; object-fit: contain; margin-bottom: 15px; border-radius: 10px; background: #0d0e15; padding: 8px; border: 1px solid #26293b; }
    .card-produto h3 { font-size: 1.2rem; margin-bottom: 8px; color: #f3f4f6; }
    .card-produto .preco { font-size: 1.5rem; font-weight: bold; color: #10b981; margin-bottom: 12px; }
    .btn-ver { background: #a855f7; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; width: 100%; transition: background 0.2s; }
    .btn-ver:hover { background: #9333ea; }

    /* Detalhes do Produto */
    .btn-voltar { background: transparent; color: #9ca3af; border: 1px solid #374151; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-bottom: 20px; font-weight: bold; transition: 0.2s; }
    .btn-voltar:hover { color: #fff; border-color: #a855f7; }
    
    .detalhes-container { background: #161824; border: 1px solid #2d2f45; border-radius: 12px; padding: 30px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px; }
    .detalhes-container img { width: 120px; height: 120px; object-fit: contain; background: #0d0e15; padding: 10px; border-radius: 12px; border: 1px solid #26293b; }
    
    /* Formulário de Checkout */
    .form-box { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; text-align: left; margin-top: 10px; }
    .form-group label { font-size: 0.85rem; color: #9ca3af; margin-bottom: 5px; display: block; }
    .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2d2f45; background: #0d0e15; color: #fff; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: #a855f7; }
    
    .btn-wpp { width: 100%; background: #25d366; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.05rem; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
    .btn-wpp:hover { background: #1da851; }
  </style>
</head>
<body>

  <header>
    <h1 onclick="mostrarTela('tela-home')">👻 DON STORE</h1>
    <p>Catálogo de Serviços - Atendimento Rápido</p>
  </header>

  <!-- TELA 1: CATÁLOGO PRINCIPAL -->
  <main id="tela-home" class="screen active">
    <div class="grid-produtos" id="grid-produtos">
      <p style="text-align: center; width: 100%;">Carregando serviços...</p>
    </div>
  </main>

  <!-- TELA 2: DETALHES E CHECKOUT -->
  <main id="tela-detalhes" class="screen">
    <button class="btn-voltar" onclick="mostrarTela('tela-home')">← Voltar ao Catálogo</button>
    <div class="detalhes-container">
      <img id="det-img" src="" alt="Produto">
      <h2 id="det-nome">Nome do Serviço</h2>
      <p id="det-desc" style="color: #9ca3af; max-width: 500px;">Descrição do serviço...</p>
      <div id="det-preco" class="preco" style="font-size: 2rem;">R$ 0,00</div>

      <div class="form-box">
        <h4 style="color: #a855f7; text-align: center; margin-bottom: 5px;">Dados para Recebimento / Identificação</h4>
        <div class="form-group">
          <label>Seu Nome ou Apelido</label>
          <input type="text" id="cli-nome" placeholder="Ex: João Silva" required>
        </div>
        <div class="form-group">
          <label>E-mail (Para receber a entrega)</label>
          <input type="email" id="cli-email" placeholder="seuemail@gmail.com" required>
        </div>
        <div class="form-group">
          <label>Crie uma Senha (Identificação de Acesso)</label>
          <input type="password" id="cli-senha" placeholder="******" required>
        </div>
        <button class="btn-wpp" onclick="processarPedido()">
          💬 Finalizar Pedido no WhatsApp
        </button>
      </div>
    </div>
  </main>

  <script>
    let produtoSelecionado = null;

    function mostrarTela(idTela) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(idTela).classList.add('active');
      window.scrollTo(0, 0);
    }

    async function carregarProdutos() {
      try {
        const res = await fetch('/api/produtos');
        const produtos = await res.json();
        
        const container = document.getElementById('grid-produtos');
        container.innerHTML = '';

        produtos.forEach(p => {
          const card = document.createElement('div');
          card.className = 'card-produto';
          card.onclick = () => abrirDetalhes(p);
          
          card.innerHTML = `
            <img src="${p.imagem}" alt="${p.nome}">
            <h3>${p.nome}</h3>
            <div class="preco">R$ ${p.preco.toFixed(2).replace('.', ',')}</div>
            <button class="btn-ver">Ver Detalhes</button>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        document.getElementById('grid-produtos').innerHTML = '<p style="color:red; text-align:center;">Erro ao carregar catálogo. Tente novamente.</p>';
      }
    }

    function abrirDetalhes(produto) {
      produtoSelecionado = produto;
      document.getElementById('det-img').src = produto.imagem;
      document.getElementById('det-nome').innerText = produto.nome;
      document.getElementById('det-desc').innerText = produto.descricao;
      document.getElementById('det-preco').innerText = `R$ ${produto.preco.toFixed(2).replace('.', ',')}`;
      mostrarTela('tela-detalhes');
    }

    function processarPedido() {
      const nome = document.getElementById('cli-nome').value.trim();
      const email = document.getElementById('cli-email').value.trim();
      const senha = document.getElementById('cli-senha').value.trim();

      if (!nome || !email || !senha) {
        alert('Por favor, preencha todos os campos para identificação antes de prosseguir.');
        return;
      }

      const mensagem = `*NOVO PEDIDO - DON STORE*\n\n` +
                       `📌 *Serviço:* ${produtoSelecionado.nome}\n` +
                       `💰 *Valor:* R$ ${produtoSelecionado.preco.toFixed(2).replace('.', ',')}\n\n` +
                       `👤 *Cliente:* ${nome}\n` +
                       `📧 *E-mail:* ${email}\n` +
                       `🔑 *Senha de Acesso:* ${senha}\n\n` +
                       `Gostaria de realizar o pagamento para dar andamento!`;

      const urlWpp = `https://wa.me/${produtoSelecionado.whatsapp}?text=${encodeURIComponent(mensagem)}`;
      window.open(urlWpp, '_blank');
    }

    carregarProdutos();
  </script>
</body>
</html>
