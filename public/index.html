<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DON STORE | Serviços & Infoprodutos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #030305;
      --card-bg: rgba(12, 12, 18, 0.92);
      --card-border: rgba(220, 38, 38, 0.3);
      --card-border-hover: rgba(220, 38, 38, 0.8);
      --red-primary: #dc2626;
      --red-hover: #b91c1c;
      --red-glow: rgba(220, 38, 38, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --green-accent: #22c55e;
      --blue-accent: #3b82f6;
      --gold-accent: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Fundo Nítido Dark com Overlay Gradient */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at center, rgba(3, 3, 5, 0.65) 0%, rgba(3, 3, 5, 0.98) 100%),
        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600&auto=format&fit=crop') no-repeat center top / cover;
      opacity: 0.35;
      z-index: -1;
      pointer-events: none;
      filter: contrast(130%) brightness(85%);
    }

    /* BARRA NAVEGAÇÃO */
    header {
      width: 100%;
      max-width: 1200px;
      padding: 20px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(220, 38, 38, 0.25);
      background: rgba(3, 3, 5, 0.9);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff 20%, var(--red-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      text-shadow: 0 0 20px var(--red-glow);
      letter-spacing: 1px;
    }

    .header-nav {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: color 0.2s;
      cursor: pointer;
    }

    .nav-link:hover {
      color: var(--text-main);
    }

    .btn-cart-nav {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-cart-nav:hover {
      background: var(--red-primary);
      box-shadow: 0 0 12px var(--red-glow);
    }

    /* HERO BANNER */
    .hero-banner {
      width: 100%;
      max-width: 1200px;
      padding: 40px 20px 20px 20px;
      text-align: center;
    }

    .hero-banner h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 10px;
      background: linear-gradient(180deg, #ffffff 40%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-banner p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* BARRA DE CONTROLES E FILTROS */
    .controls-container {
      width: 100%;
      max-width: 1200px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 18px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }

    .search-input:focus {
      border-color: var(--red-primary);
      box-shadow: 0 0 10px var(--red-glow);
    }

    .categories-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--red-primary);
      color: #fff;
      border-color: var(--red-primary);
      box-shadow: 0 0 10px var(--red-glow);
    }

    /* CONTAINER DAS TELAS */
    .screen {
      display: none;
      width: 100%;
      max-width: 1200px;
      padding: 10px 20px 60px 20px;
    }

    .screen.active {
      display: block;
    }

    /* GRID DE PRODUTOS */
    .grid-produtos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
      width: 100%;
    }

    .card-produto {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 24px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .card-produto:hover {
      transform: translateY(-6px);
      border-color: var(--card-border-hover);
      box-shadow: 0 10px 25px rgba(220, 38, 38, 0.2);
    }

    .card-produto img {
      width: 68px;
      height: 68px;
      margin-bottom: 14px;
      filter: drop-shadow(0 0 8px var(--red-glow));
    }

    .badge-entrega {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-email { background: rgba(59, 130, 246, 0.18); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-whatsapp { background: rgba(34, 197, 94, 0.18); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }

    .card-titulo {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.83rem;
      line-height: 1.4;
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .preco-tag {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--green-accent);
      margin-bottom: 16px;
      text-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
    }

    .btn-comprar {
      width: 100%;
      background: linear-gradient(180deg, var(--red-primary) 0%, var(--red-hover) 100%);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px var(--red-glow);
    }

    .btn-comprar:hover {
      filter: brightness(1.15);
      transform: scale(1.02);
    }

    /* MODAL E TELA DE DETALHES */
    .box-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 35px;
      max-width: 480px;
      margin: 30px auto;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
    }

    .form-group {
      text-align: left;
      margin-top: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      background: #050508;
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--red-primary);
    }

    .btn-voltar {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-voltar:hover {
      color: #fff;
    }

    /* FOOTER */
    footer {
      width: 100%;
      padding: 25px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(3, 3, 5, 0.95);
      margin-top: auto;
    }

    footer p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .hero-banner h1 { font-size: 2rem; }
      .controls-container { flex-direction: column; align-items: stretch; }
      .categories-group { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="brand-logo" onclick="mostrarTela('tela-home')">DON STORE</div>
    <div class="header-nav">
      <span class="nav-link" onclick="mostrarTela('tela-home')">Catálogo</span>
      <button class="btn-cart-nav" onclick="alert('Seus pedidos são finalizados direto por e-mail ou WhatsApp!')">
        🛒 Suporte
      </button>
    </div>
  </header>

  <!-- TELA PRINCIPAL (HOME) -->
  <div id="tela-home" class="screen active">
    <div class="hero-banner">
      <h1>SERVIÇOS DIGITAIS & INFOPRODUTOS</h1>
      <p>Aprovação rápida, entrega garantida e atendimento personalizado via WhatsApp e E-mail.</p>
    </div>

    <div class="controls-container">
      <div class="search-box">
        <input type="text" id="busca-input" class="search-input" placeholder="🔍 Digite para pesquisar um serviço..." oninput="filtrarProdutos()">
      </div>

      <div class="categories-group">
        <button class="cat-btn active" onclick="filtrarCategoria('todas', this)">Todos</button>
        <button class="cat-btn" onclick="filtrarCategoria('Streaming', this)">Streaming</button>
        <button class="cat-btn" onclick="filtrarCategoria('Documentos', this)">Documentos</button>
        <button class="cat-btn" onclick="filtrarCategoria('Escolar', this)">Escolar</button>
        <button class="cat-btn" onclick="filtrarCategoria('Contas', this)">Contas</button>
      </div>
    </div>

    <div class="grid-produtos" id="grid-produtos"></div>
  </div>

  <!-- TELA DE CHECKOUT / DETALHES -->
  <div id="tela-detalhes" class="screen">
    <button class="btn-voltar" onclick="mostrarTela('tela-home')">← Voltar para o catálogo</button>

    <div class="box-container" style="text-align: center;">
      <img id="det-img" src="" alt="" style="width:70px; height:70px;">
      <h2 id="det-nome" style="font-family:'Cinzel', serif; margin-top:12px; font-size:1.6rem;"></h2>
      <p id="det-desc" style="color:var(--text-muted); font-size:0.9rem; margin-top:6px;"></p>
      <div id="det-preco" class="preco-tag" style="margin-top:15px;"></div>

      <div class="form-group">
        <label>Seu Nome Completo *</label>
        <input type="text" id="cli-nome" placeholder="Digite seu nome">
      </div>

      <div class="form-group">
        <label>Seu E-mail Principal *</label>
        <input type="email" id="cli-email" placeholder="seuemail@exemplo.com">
      </div>

      <button id="btn-finalizar-acao" class="btn-comprar" style="margin-top:25px;" onclick="processarPedido()">
        Confirmar e Finalizar
      </button>
    </div>
  </div>

  <!-- RODAPÉ -->
  <footer>
    <p>DON STORE &copy; 2026 - Todos os direitos reservados.</p>
  </footer>

  <script>
    let todosProdutos = [];
    let produtoSelecionado = null;
    let categoriaAtual = 'todas';

    function mostrarTela(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo(0, 0);
    }

    async function carregarProdutos() {
      try {
        const res = await fetch('/api/produtos');
        todosProdutos = await res.json();
        renderizarProdutos(todosProdutos);
      } catch (err) {
        console.error('Erro ao carregar produtos:', err);
      }
    }

    function renderizarProdutos(lista) {
      const grid = document.getElementById('grid-produtos');
      grid.innerHTML = '';

      if (lista.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Nenhum serviço encontrado com esse nome.</p>`;
        return;
      }

      lista.forEach(p => {
        const isEmail = p.entregaTipo === 'EMAIL';
        const card = document.createElement('div');
        card.className = 'card-produto';
        card.innerHTML = `
          <span class="badge-entrega ${isEmail ? 'badge-email' : 'badge-whatsapp'}">
            ${isEmail ? '⚡ Entrega E-mail' : '💬 Pedir no WhatsApp'}
          </span>
          <img src="${p.imagem}" alt="${p.nome}">
          <div class="card-titulo">${p.nome}</div>
          <div class="card-desc">${p.descricao}</div>
          <div class="preco-tag">R$ ${p.preco.toFixed(2).replace('.', ',')}</div>
          <button class="btn-comprar" onclick='abrirCheckout(${JSON.stringify(p)})'>
            ${isEmail ? 'Comprar Agora' : 'Solicitar Serviço'}
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function filtrarCategoria(cat, btn) {
      categoriaAtual = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtrarProdutos();
    }

    function filtrarProdutos() {
      const termo = document.getElementById('busca-input').value.toLowerCase();
      const filtrados = todosProdutos.filter(p => {
        const bateCat = categoriaAtual === 'todas' || p.categoria === categoriaAtual;
        const bateBusca = p.nome.toLowerCase().includes(termo) || p.descricao.toLowerCase().includes(termo);
        return bateCat && bateBusca;
      });
      renderizarProdutos(filtrados);
    }

    function abrirCheckout(p) {
      produtoSelecionado = p;
      document.getElementById('det-img').src = p.imagem;
      document.getElementById('det-nome').innerText = p.nome;
      document.getElementById('det-desc').innerText = p.descricao;
      document.getElementById('det-preco').innerText = `R$ ${p.preco.toFixed(2).replace('.', ',')}`;
      
      const btnAcao = document.getElementById('btn-finalizar-acao');
      if (p.entregaTipo === 'EMAIL') {
        btnAcao.innerText = 'Confirmar Pedido por E-mail';
      } else {
        btnAcao.innerText = 'Iniciar Atendimento no WhatsApp';
      }

      mostrarTela('tela-detalhes');
    }

    function processarPedido() {
      const email = document.getElementById('cli-email').value.trim();
      const nome = document.getElementById('cli-nome').value.trim();

      if (!email || !nome) {
        alert('Por favor, preencha seu nome e e-mail antes de continuar.');
        return;
      }

      if (produtoSelecionado.entregaTipo === 'EMAIL') {
        alert(`Obrigado, ${nome}! Seu pedido de ${produtoSelecionado.nome} foi registrado com sucesso. Enviamos a confirmação para ${email}.`);
        mostrarTela('tela-home');
      } else {
        const mensagem = `*SOLICITAÇÃO DE SERVIÇO - DON STORE*\n\n` +
                         `📌 *Serviço:* ${produtoSelecionado.nome}\n` +
                         `💰 *Valor:* R$ ${produtoSelecionado.preco.toFixed(2).replace('.', ',')}\n\n` +
                         `👤 *Cliente:* ${nome}\n` +
                         `📧 *E-mail:* ${email}\n\n` +
                         `Olá, gostaria de dar andamento a esse pedido!`;

        const linkWhatsApp = `https://wa.me/${produtoSelecionado.whatsapp}?text=${encodeURIComponent(mensagem)}`;
        window.open(linkWhatsApp, '_blank');
      }
    }

    // INICIALIZA O CARREGAMENTO
    carregarProdutos();
  </script>
</body>
</html>
